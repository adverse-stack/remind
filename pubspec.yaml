name: schedule_reminder
description: Personal schedule & silent overlay reminder app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.0
  intl: ^0.19.0
  timezone: ^0.9.2

  # UI
  table_calendar: ^3.0.9
  flutter_slidable: ^3.0.0

  # Notifications & Overlay
  flutter_local_notifications: ^17.0.0
  flutter_screen_overlay: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
